<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Manager</title>
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <main class="content-form">
        <img src="./assets/bg.jpg" alt="Imagem fundo kanbam" />

        <div id="landing-page" style="display: none;">
            <form class="form">
                <h3>Bem-vindo ao Task Manager</h3>
                <p style="text-align: center; margin: 20px 0;">Organize suas tarefas de forma eficiente</p>
                <button type="button" class="btn-action" onclick="window.location.href='/api/login'">Entrar</button>
            </form>
        </div>

        <div id="loading" class="form" style="text-align: center;">
            <h3>Carregando...</h3>
        </div>
    </main>
    
    <script type="text/javascript" src="jquery-3.6.3.min.js"></script>
    <script>
        $(function() {
            $.ajax({
                url: '/api/auth/user',
                type: 'get',
                success: function(user) {
                    if (user && user.id) {
                        window.location.href = '/pages/quadros/index.html';
                    } else {
                        $('#loading').hide();
                        $('#landing-page').show();
                    }
                },
                error: function() {
                    $('#loading').hide();
                    $('#landing-page').show();
                }
            });
        });
    </script>
</body>
</html>
